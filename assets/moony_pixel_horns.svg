<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Moony with devil horns (Metal Mode) -->

  <!-- Left horn -->
  <path d="M 22 12 L 18 4 L 24 12 Z" fill="#8B0000" stroke="#FF1493" stroke-width="2"/>

  <!-- Right horn -->
  <path d="M 42 12 L 46 4 L 40 12 Z" fill="#8B0000" stroke="#FF1493" stroke-width="2"/>

  <!-- Main body -->
  <circle cx="32" cy="32" r="20" fill="#FFD3FF" stroke="#FF1493" stroke-width="3"/>

  <!-- Eyes (more intense) -->
  <circle cx="25" cy="28" r="4" fill="#8B0000"/>
  <circle cx="39" cy="28" r="4" fill="#8B0000"/>

  <!-- Mischievous smile -->
  <path d="M 23 38 Q 32 45, 41 38" fill="none" stroke="#8B0000" stroke-width="3" stroke-linecap="round"/>

  <!-- Intense glow -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FF1493" stroke-width="2" opacity="0.5"/>
</svg>
