<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Moony with corpse paint (black metal style) -->

  <!-- Main body -->
  <circle cx="32" cy="32" r="20" fill="#FFD3FF" stroke="#FF5CA8" stroke-width="2"/>

  <!-- Left eye black paint -->
  <circle cx="25" cy="28" r="8" fill="#0A0A0F"/>
  <circle cx="25" cy="28" r="3" fill="#FFD3FF"/>

  <!-- Right eye black paint -->
  <circle cx="39" cy="28" r="8" fill="#0A0A0F"/>
  <circle cx="39" cy="28" r="3" fill="#FFD3FF"/>

  <!-- Vertical black streaks (corpse paint) -->
  <line x1="25" y1="36" x2="25" y2="46" stroke="#0A0A0F" stroke-width="2"/>
  <line x1="39" y1="36" x2="39" y2="46" stroke="#0A0A0F" stroke-width="2"/>

  <!-- Black lipstick smile -->
  <path d="M 23 38 Q 32 43, 41 38" fill="none" stroke="#0A0A0F" stroke-width="4" stroke-linecap="round"/>

  <!-- Glow -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FF5CA8" stroke-width="1" opacity="0.3"/>
</svg>
